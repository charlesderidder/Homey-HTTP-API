<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Achtergrond verloop -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Wereldbol verloop -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Tekst verloop -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Gloeieffect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Achtergrond -->
  <rect width="500" height="500" rx="24" fill="url(#bgGlow)"/>

  <!-- Wereldbol Groep -->
  <g transform="translate(250, 190)">
    <!-- Buitenste gloeiende cirkel -->
    <circle r="100" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4" filter="url(#glow)"/>
    
    <!-- Basis Bol -->
    <circle r="95" fill="none" stroke="url(#globeGrad)" stroke-width="5"/>

    <!-- Breedtegraad lijnen (Horizontaal) -->
    <line x1="-95" y1="0" x2="95" y2="0" stroke="url(#globeGrad)" stroke-width="3"/>
    <ellipse rx="95" ry="40" fill="none" stroke="url(#globeGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
    <ellipse rx="95" ry="75" fill="none" stroke="url(#globeGrad)" stroke-width="2" opacity="0.5"/>

    <!-- Lengtegraad lijnen (Verticaal) -->
    <line x1="0" y1="-95" x2="0" y2="95" stroke="url(#globeGrad)" stroke-width="3"/>
    <ellipse rx="40" ry="95" fill="none" stroke="url(#globeGrad)" stroke-width="2.5"/>
    <ellipse rx="75" ry="95" fill="none" stroke="url(#globeGrad)" stroke-width="2" opacity="0.5"/>

    <!-- Netwerk Knooppunten (API Verbindingen) -->
    <circle cx="-40" cy="-35" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="40" cy="35" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="60" cy="-55" r="4" fill="#38bdf8"/>
    <circle cx="-60" cy="55" r="4" fill="#38bdf8"/>
  </g>

  <!-- Tekst: HTTP API -->
  <text x="250" y="365" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="42" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="6">
    HTTP API
  </text>

  <!-- Subtekst / Decoratieve lijn -->
  <line x1="170" y1="395" x2="330" y2="395" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="250" cy="395" r="4" fill="#38bdf8"/>
</svg>
